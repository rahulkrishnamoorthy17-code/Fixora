<!DOCTYPE html>
<html lang="en" dir="ltr" data-theme="light" data-bs-theme="light">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Login – Fixora</title>
<meta name="description" content="Secure Fixora administrator sign in for repair operations management.">
<link id="bs-css" rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
<link rel="stylesheet" href="css/style.css">
<script>(function(){try{var t=localStorage.getItem('fx-theme')||'light';var d=localStorage.getItem('fx-dir')||'ltr';document.documentElement.setAttribute('data-theme',t);document.documentElement.setAttribute('data-bs-theme',t);document.documentElement.setAttribute('dir',d);}catch(e){}})();</script>
</head>
<body data-no-booking>
<div class="auth-main min-vh-100 d-flex align-items-center py-5">
  <div class="container"><div class="row justify-content-center"><div class="col-lg-5 col-md-7">
    <div class="auth-card-inner card-premium p-4 p-md-5">
      <a class="navbar-brand mb-4 d-inline-flex" href="index.html"><span class="brand-mark"><i class="bi bi-wrench-adjustable"></i></span>Fixora</a>
      <div class="mb-4"><span class="badge-soft blue mb-2 d-inline-flex"><i class="bi bi-shield-lock me-1"></i>Administrator Access</span><h1 class="h3 mb-2">Admin Sign In</h1><p class="mb-0" style="color:var(--fx-muted)">Manage analytics, customers, repair orders and support messages.</p></div>
      <form id="adminLoginForm" novalidate>
        <label class="form-label-premium" for="adminEmail">Admin Email</label>
        <input class="form-control-premium mb-3" type="email" id="adminEmail" value="admin@fixora.com" required>
        <label class="form-label-premium" for="adminPassword">Password</label>
        <div class="position-relative mb-3"><input class="form-control-premium pe-5" type="password" id="adminPassword" value="admin123" required><button class="btn btn-sm position-absolute top-50 end-0 translate-middle-y me-2" type="button" id="toggleAdminPassword" aria-label="Show password"><i class="bi bi-eye"></i></button></div>
        <div class="alert alert-danger d-none" id="adminLoginError">Invalid admin credentials. Use the demo credentials shown below.</div>
        <button class="btn btn-gradient w-100" type="submit"><i class="bi bi-box-arrow-in-right me-2"></i>Sign In to Dashboard</button>
      </form>
      <div class="tip-box mt-4"><i class="bi bi-info-circle"></i><p><strong>Demo:</strong> admin@fixora.com / admin123</p></div>
      <div class="d-flex justify-content-between flex-wrap gap-2 mt-4"><a href="index.html"><i class="bi bi-arrow-left me-1"></i>Back to website</a><a href="login.html">Customer login</a></div>
    </div>
  </div></div></div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
(function(){
 var f=document.getElementById('adminLoginForm'), e=document.getElementById('adminLoginError');
 document.getElementById('toggleAdminPassword').onclick=function(){var p=document.getElementById('adminPassword');p.type=p.type==='password'?'text':'password';this.querySelector('i').className=p.type==='password'?'bi bi-eye':'bi bi-eye-slash';};
 f.addEventListener('submit',function(ev){ev.preventDefault();var mail=document.getElementById('adminEmail').value.trim(),pass=document.getElementById('adminPassword').value;if(mail==='admin@fixora.com'&&pass==='admin123'){localStorage.setItem('fx-admin-auth','1');location.href='admin-dashboard.html';}else{e.classList.remove('d-none');}});
})();
</script>
</body></html>
